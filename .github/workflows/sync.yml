name: Sync spec

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live spec
        run: |
          curl -fsS https://api.insightsocial.app/v1/openapi.json -o openapi.tmp.json
          # Refuse anything that is not an OpenAPI document with paths in it.
          jq -e '.openapi and (.paths | length > 0)' openapi.tmp.json > /dev/null
          jq . openapi.tmp.json > openapi.json
          rm openapi.tmp.json
      - name: Commit if it changed
        run: |
          if git diff --quiet -- openapi.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(openapi): sync from live API"
          git push
